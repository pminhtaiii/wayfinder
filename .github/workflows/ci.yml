name: Pull Request CI

on:
  pull_request:
    branches: [development]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ github.event_name == 'schedule' && 'false' || steps.filter.outputs.api }}
      web: ${{ github.event_name == 'schedule' && 'false' || steps.filter.outputs.web }}
      agent: ${{ github.event_name == 'schedule' && 'false' || steps.filter.outputs.agent }}
      security: ${{ github.event_name == 'schedule' || steps.filter.outputs.security == 'true' }}
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Test agent context CLI
        run: node --test tests/ci/agent-context.test.mjs
      - name: Test agent work CLI
        run: node --test tests/ci/agent-work.test.mjs
      - name: Verify workflow contract
        run: node --test tests/ci/ci-workflow.contract.test.mjs tests/ci/security-change-filter.test.mjs
      - name: Verify supplier identifier contracts
        run: node --test tests/ci/supplier-identifiers-migration.contract.test.mjs tests/ci/supplier-identifiers-runner.contract.test.mjs
      - name: Install checksum-verified actionlint
        run: |
          curl --fail --location --silent --show-error --output actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --status
          tar --extract --gzip --file actionlint.tar.gz actionlint
          ./actionlint .github/workflows/ci.yml
      - name: Detect affected services
        id: filter
        if: ${{ github.event_name != 'schedule' }}
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - '.github/**'
              - '.gitattributes'
              - 'tests/ci/**'
              - 'scripts/ci/**'
              - 'tests/smoke/**'
              - 'scripts/ci/run-smoke-sanity.mjs'
              - 'docker-compose.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/patches/**'
              - 'tsconfig.json'
              - '.eslintrc.json'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - '.github/**'
              - '.gitattributes'
              - 'tests/ci/**'
              - 'scripts/ci/**'
              - 'tests/smoke/**'
              - 'scripts/ci/run-smoke-sanity.mjs'
              - 'docker-compose.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/patches/**'
              - 'tsconfig.json'
              - '.eslintrc.json'
            agent:
              - 'apps/agent/**'
              - 'packages/shared/**'
              - '.github/**'
              - '.gitattributes'
              - 'tests/ci/**'
              - 'scripts/ci/**'
              - 'tests/smoke/**'
              - 'scripts/ci/run-smoke-sanity.mjs'
              - 'docker-compose.yml'
              - 'pyproject.toml'
              - 'uv.lock'
            security:
              - '.github/workflows/**'
              - '.gitleaks.toml'
              - 'apps/**'
              - 'packages/**'
              - 'scripts/security/**'
              - 'tests/security/**'
              - 'tests/security/toolchain.json'
              - 'tests/security/exceptions.json'
              - 'docs/security/**'
              - 'scripts/patches/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'pyproject.toml'
              - 'apps/agent/pyproject.toml'
              - 'uv.lock'
              - 'apps/api/src/auth/**'
              - 'apps/web/**auth**'
              - 'apps/api/src/**'
              - 'apps/agent/src/**'
              - 'apps/web/components/**'

  api-gate:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci_dummy?schema=public
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Check changed TypeScript escapes
        run: node scripts/ci/check-type-escapes.mjs --base HEAD^1
      - name: Test TypeScript escape guard
        run: node --test tests/ci/check-type-escapes.test.mjs
      - name: Lint API and shared code
        run: pnpm exec eslint "apps/api/**/*.ts" "packages/shared/**/*.ts" --max-warnings 0
      - name: Build shared package
        run: pnpm build:shared
      - name: Generate Prisma Client
        run: pnpm --filter @api/backend prisma:generate
      - name: Typecheck API
        run: pnpm --filter @api/backend exec tsc --noEmit

  api-unit-tests:
    needs: [detect-changes, api-gate]
    if: ${{ needs.detect-changes.outputs.api == 'true' && needs.api-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci_dummy?schema=public
      NODE_ENV: test
      DUFFEL_ACCESS_TOKEN: duffel_test_ci_not_a_secret
      STRIPE_SECRET_KEY: sk_test_ci_not_a_secret
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_secret
      JWT_SECRET: ci-not-a-secret-jwt
      AGENT_SERVICE_API_KEY: ci-not-a-secret-agent-key
      CLAIM_TOKEN_SECRET: ci-not-a-secret-claim-key
      ATTESTATION_SECRET: ci-not-a-secret-attestation
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CHAT_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package and generate Prisma Client
        run: |
          pnpm build:shared
          pnpm --filter @api/backend prisma:generate
      - name: Run API unit tests with loopback-only network
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/ci/node-network-guard.cjs
        run: pnpm --filter @api/backend run test:unit

  api-interface-tests:
    needs: [detect-changes, api-gate]
    if: ${{ needs.detect-changes.outputs.api == 'true' && needs.api-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci_dummy?schema=public
      NODE_ENV: test
      DUFFEL_ACCESS_TOKEN: duffel_test_ci_not_a_secret
      STRIPE_SECRET_KEY: sk_test_ci_not_a_secret
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_secret
      JWT_SECRET: ci-not-a-secret-jwt
      AGENT_SERVICE_API_KEY: ci-not-a-secret-agent-key
      CLAIM_TOKEN_SECRET: ci-not-a-secret-claim-key
      ATTESTATION_SECRET: ci-not-a-secret-attestation
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CHAT_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package and generate Prisma Client
        run: |
          pnpm build:shared
          pnpm --filter @api/backend prisma:generate
      - name: Verify API test partitions cover the previous suite
        run: pnpm --filter @api/backend exec node test/api-test-partition.contract.test.mjs
      - name: Run shared package contract tests
        run: pnpm --filter @shared/types test
      - name: Run API contract tests with loopback-only network
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/ci/node-network-guard.cjs
        run: pnpm --filter @api/backend run test:contract
      - name: Run API component tests with loopback-only network
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/ci/node-network-guard.cjs
        run: pnpm --filter @api/backend run test:component

  api-performance-tests:
    needs: [detect-changes, api-gate]
    if: ${{ needs.detect-changes.outputs.api == 'true' && needs.api-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci_dummy?schema=public
      NODE_ENV: test
      DUFFEL_ACCESS_TOKEN: duffel_test_ci_not_a_secret
      STRIPE_SECRET_KEY: sk_test_ci_not_a_secret
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_secret
      JWT_SECRET: ci-not-a-secret-jwt
      AGENT_SERVICE_API_KEY: ci-not-a-secret-agent-key
      CLAIM_TOKEN_SECRET: ci-not-a-secret-claim-key
      ATTESTATION_SECRET: ci-not-a-secret-attestation
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CHAT_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package and generate Prisma Client
        run: |
          pnpm build:shared
          pnpm --filter @api/backend prisma:generate
      - name: Run API performance checks with loopback-only network
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/ci/node-network-guard.cjs
        run: pnpm --filter @api/backend run test:performance:unit

  api-integration-tests:
    needs: [detect-changes, api-gate]
    if: ${{ needs.detect-changes.outputs.api == 'true' && needs.api-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fulfillment_recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fulfillment_recovery_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fulfillment_recovery_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      NODE_ENV: test
      DUFFEL_ACCESS_TOKEN: duffel_test_ci_not_a_secret
      STRIPE_SECRET_KEY: sk_test_ci_not_a_secret
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_secret
      JWT_SECRET: ci-not-a-secret-jwt
      AGENT_SERVICE_API_KEY: ci-not-a-secret-agent-key
      CLAIM_TOKEN_SECRET: ci-not-a-secret-claim-key
      ATTESTATION_SECRET: ci-not-a-secret-attestation
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CHAT_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      FEATURE_FLAG_BOOKING_READINESS: 'true'
      FEATURE_FLAG_CHAT_HANDOFF_ISSUE: 'true'
      FEATURE_FLAG_CHAT_HANDOFF_ACCEPT: 'true'
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken_cache
      FULFILLMENT_HARNESS_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fulfillment_recovery_test
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up uv 0.12.0 and Python 3.11
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.0
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install Agent dependencies from root lock
        run: uv sync --locked --package agent
      - name: Pre-warm tiktoken cache
        run: uv run python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Prepare API E2E database
        run: |
          pnpm build:shared
          pnpm --filter @api/backend prisma:generate
          pnpm --filter @api/backend exec prisma migrate deploy
      - name: Prove supplier identifier fresh and upgrade migrations
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/ci/node-network-guard.cjs
          T054_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
        run: node tests/ci/supplier-identifiers-migration.e2e.mjs
      - name: Run API integration tests with loopback-only network
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/ci/node-network-guard.cjs
          TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken_cache
        run: pnpm --filter @api/backend run test:integration

  web-gate:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci_dummy?schema=public
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Check changed TypeScript escapes
        run: node scripts/ci/check-type-escapes.mjs --base HEAD^1
      - name: Lint web application
        run: pnpm --filter @web/frontend lint
      - name: Validate Next.js route files
        run: pnpm --filter @web/frontend check:routes
      - name: Build shared package and typecheck web application
        run: |
          pnpm build:shared
          pnpm --filter @web/frontend typecheck

  web-unit-tests:
    needs: [detect-changes, web-gate]
    if: ${{ needs.detect-changes.outputs.web == 'true' && needs.web-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm build:shared
      - name: Run web unit tests with loopback-only network
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/ci/node-network-guard.cjs
        run: pnpm --filter @web/frontend run test:unit

  web-interface-tests:
    needs: [detect-changes, web-gate]
    if: ${{ needs.detect-changes.outputs.web == 'true' && needs.web-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_FRONTEND_ONLY: 'true'
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm build:shared
      - name: Run web interface characterization
        run: pnpm --filter @web/frontend test:characterization

  web-build:
    needs: [detect-changes, web-gate]
    if: ${{ needs.detect-changes.outputs.web == 'true' && needs.web-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      NEXTAUTH_SECRET: ci-non-production-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_AGENT_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_FEATURE_FLAG_BOOKING_READINESS: 'true'
      NEXT_PUBLIC_FEATURE_FLAG_CHAT_HANDOFF: 'true'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci_dummy?schema=public
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web application with loopback-only network
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/ci/node-network-guard.cjs
        run: |
          pnpm build:shared
          pnpm --filter @web/frontend build

  agent-gate:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv 0.12.0 and Python 3.11
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.0
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install Agent dependencies from root lock
        run: uv sync --locked --package agent

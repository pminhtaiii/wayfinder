  security-sast:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.security == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up uv 0.12.0 and Python 3.11
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.0
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install Semgrep
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/semgrep-bin
        run: |
          uv tool install --python 3.11 --with "setuptools<80" semgrep==1.88.0
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
      - name: Run SAST scanner
        run: node scripts/security/run-sast.mjs --mode full --sarif-output artifacts/security/sast.json --strict-scanner
      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: security-sast-results
          path: artifacts/security/
          retention-days: 5

  security-supply-chain:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.security == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install patched Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify braces patch behavior and supply chain policy
        run: node --test tests/security/braces-patch.test.mjs tests/security/supply-chain.test.mjs tests/security/workspace-audit-ignore.test.mjs
      - name: Set up uv 0.12.0 and Python 3.11
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.0
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install Gitleaks
        run: |
          curl --fail --location --silent --show-error --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo 'ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tar.gz' | sha256sum --check --status
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run supply chain scanner
        run: node scripts/security/run-supply-chain.mjs --output artifacts/security/supply-chain.json --strict
      - name: Upload Supply Chain results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: security-supply-chain-results
          path: artifacts/security/
          retention-days: 5

  smoke-and-sanity:
    needs: [detect-changes, api-unit-tests, api-interface-tests, api-integration-tests, api-performance-tests, web-build, web-unit-tests, web-interface-tests, agent-unit-tests, agent-integration-tests, agent-performance-tests]
    if: >-
      ${{
        always() &&
        needs.detect-changes.result == 'success' &&
        (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.agent == 'true') &&
        (needs.detect-changes.outputs.api != 'true' || (needs.api-unit-tests.result == 'success' && needs.api-interface-tests.result == 'success' && needs.api-integration-tests.result == 'success' && needs.api-performance-tests.result == 'success')) &&
        (needs.detect-changes.outputs.web != 'true' || (needs.web-build.result == 'success' && needs.web-unit-tests.result == 'success' && needs.web-interface-tests.result == 'success')) &&
        (needs.detect-changes.outputs.agent != 'true' || (needs.agent-unit-tests.result == 'success' && needs.agent-integration-tests.result == 'success' && needs.agent-performance-tests.result == 'success'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smoke_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-not-a-secret-jwt
      AGENT_SERVICE_API_KEY: ci-not-a-secret-agent-key
      CLAIM_TOKEN_SECRET: ci-not-a-secret-claim-key
      ATTESTATION_SECRET: ci-not-a-secret-attestation
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CHAT_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      STRIPE_SECRET_KEY: sk_test_ci_not_a_secret
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_secret
      DUFFEL_ACCESS_TOKEN: duffel_test_ci_not_a_secret
      NEXTAUTH_SECRET: ci-non-production-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_AGENT_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_FEATURE_FLAG_BOOKING_READINESS: 'true'
      NEXT_PUBLIC_FEATURE_FLAG_CHAT_HANDOFF: 'true'
      FEATURE_FLAG_BOOKING_READINESS: 'true'
      FEATURE_FLAG_CHAT_HANDOFF_ISSUE: 'true'
      FEATURE_FLAG_CHAT_HANDOFF_ACCEPT: 'true'
      SMOKE_MOCK_URL: http://127.0.0.1:4010
      DUFFEL_API_URL: http://127.0.0.1:4010
      STRIPE_API_URL: http://127.0.0.1:4010
      AGENT_SERVICE_URL: http://127.0.0.1:3002
      NESTJS_API_URL: http://127.0.0.1:3001/api
      API_URL: http://127.0.0.1:3001
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken_cache
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up uv 0.12.0 and Python 3.11
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.0
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Agent dependencies from root lock
        run: uv sync --locked --package agent
      - name: Start Compose services
        run: docker compose up -d
      - name: Build shared package, generate Prisma Client, and deploy migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smoke_test?schema=public
        run: |
          pnpm build:shared
          pnpm --filter @api/backend prisma:generate
          pnpm --filter @api/backend exec prisma migrate deploy
          pnpm --filter @api/backend exec prisma db seed
      - name: Build API and Web applications
        run: |
          pnpm --filter @api/backend build
          pnpm --filter @web/frontend build
      - name: Run smoke and sanity orchestrator
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/tests/ci/node-network-guard.cjs
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smoke_test?schema=public
          REDIS_URL: redis://127.0.0.1:6379/0
          DUFFEL_API_URL: http://127.0.0.1:4010
          STRIPE_API_URL: http://127.0.0.1:4010
          AGENT_SERVICE_URL: http://127.0.0.1:3002
          NESTJS_API_URL: http://127.0.0.1:3001/api
          API_URL: http://127.0.0.1:3001
          SMOKE_MOCK_URL: http://127.0.0.1:4010
          JWT_SECRET: ci-not-a-secret-jwt
          AGENT_SERVICE_API_KEY: ci-not-a-secret-agent-key
          CLAIM_TOKEN_SECRET: ci-not-a-secret-claim-key
          STRIPE_SECRET_KEY: sk_test_ci_not_a_secret
          STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_secret
          DUFFEL_ACCESS_TOKEN: duffel_test_ci_not_a_secret
          FEATURE_FLAG_BOOKING_READINESS: 'true'
          FEATURE_FLAG_CHAT_HANDOFF_ISSUE: 'true'
          FEATURE_FLAG_CHAT_HANDOFF_ACCEPT: 'true'
          TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken_cache
        run: node scripts/ci/run-smoke-sanity.mjs --mode=ci
      - name: Collect Compose diagnostics
        if: ${{ always() }}
        run: docker compose ps
      - name: Tear down Compose services
        if: ${{ always() }}
        run: docker compose down

  ci-status:
    if: ${{ always() }}
    needs:
      [
        detect-changes,
        api-gate,
        api-unit-tests,
        api-interface-tests,
        api-integration-tests,
        api-performance-tests,
        web-gate,
        web-build,
        web-unit-tests,
        web-interface-tests,
        agent-gate,
        agent-unit-tests,
        agent-integration-tests,
        agent-performance-tests,
        security-sast,
        security-supply-chain,
        smoke-and-sanity,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
      API_CHANGED: ${{ needs.detect-changes.outputs.api }}
      WEB_CHANGED: ${{ needs.detect-changes.outputs.web }}
      AGENT_CHANGED: ${{ needs.detect-changes.outputs.agent }}
      SECURITY_CHANGED: ${{ needs.detect-changes.outputs.security }}
      API_GATE_RESULT: ${{ needs.api-gate.result }}
      API_UNIT_TESTS_RESULT: ${{ needs.api-unit-tests.result }}
      API_INTERFACE_TESTS_RESULT: ${{ needs.api-interface-tests.result }}
      API_INTEGRATION_TESTS_RESULT: ${{ needs.api-integration-tests.result }}
      API_PERFORMANCE_TESTS_RESULT: ${{ needs.api-performance-tests.result }}
      WEB_GATE_RESULT: ${{ needs.web-gate.result }}
      WEB_BUILD_RESULT: ${{ needs.web-build.result }}
      WEB_UNIT_TESTS_RESULT: ${{ needs.web-unit-tests.result }}
      WEB_INTERFACE_TESTS_RESULT: ${{ needs.web-interface-tests.result }}
      AGENT_GATE_RESULT: ${{ needs.agent-gate.result }}
      AGENT_UNIT_TESTS_RESULT: ${{ needs.agent-unit-tests.result }}
      AGENT_INTEGRATION_TESTS_RESULT: ${{ needs.agent-integration-tests.result }}
      AGENT_PERFORMANCE_TESTS_RESULT: ${{ needs.agent-performance-tests.result }}
      SECURITY_SAST_RESULT: ${{ needs.security-sast.result }}
      SECURITY_SUPPLY_CHAIN_RESULT: ${{ needs.security-supply-chain.result }}
      SMOKE_AND_SANITY_RESULT: ${{ needs.smoke-and-sanity.result }}
      SECURITY_REPORT_DIRECTORY: artifacts/security
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download SAST artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: security-sast-results
          path: artifacts/security
      - name: Download Supply Chain artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: security-supply-chain-results
          path: artifacts/security
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Evaluate CI status
        run: node scripts/ci/evaluate-ci-status.mjs

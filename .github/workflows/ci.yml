          CI_REQUIRE_REDIS_TESTS: '1'
          TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken_cache
        run: uv run --package agent pytest apps/agent/tests -m agent_redis --strict-markers

  agent-performance-tests:
    needs: [detect-changes, agent-gate]
    if: ${{ needs.detect-changes.outputs.agent == 'true' && needs.agent-gate.result == 'success' }}
